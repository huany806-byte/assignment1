<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Receipt</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="receipt-page">

    <!-- Back Button -->
    <a href="page2.html" class="cart-back-button">
      ← Back to Cart
    </a>


    <!-- JAM -->
    <div class="receipt-item item1">
      <img src="images/jam.png" alt="Jam">
      <span>Jam</span>
    </div>

    <div class="qty qty1">4</div>
    <div class="price price1">$8.99</div>


    <!-- TOAST -->
    <div class="receipt-item item2">
      <img src="images/toast.png" alt="Toast">
      <span>Toast</span>
    </div>

    <div class="qty qty2">4</div>
    <div class="price price2">$6.99</div>


    <!-- SALMON -->
    <div class="receipt-item item3">
      <img src="images/salmon.png" alt="Salmon">
      <span>Salmon</span>
    </div>

    <div class="qty qty3">2</div>
    <div class="price price3">$12.99</div>


    <!-- APPLE -->
    <div class="receipt-item item4">
      <img src="images/apple.png" alt="Apple">
      <span>Apple</span>
    </div>

    <div class="qty qty4">3</div>
    <div class="price price4">$3.99</div>


    <!-- MEAT -->
    <div class="receipt-item item5">
      <img src="images/meat.png" alt="Meat">
      <span>Meat</span>
    </div>

    <div class="qty qty5">5</div>
    <div class="price price5">$15.99</div>


    <!-- HERSHEYS -->
    <div class="receipt-item item6">
      <img src="images/hersheys.png" alt="Hersheys">
      <span>Hersheys</span>
    </div>

    <div class="qty qty6">5</div>
    <div class="price price6">$5.99</div>

  </main>

</body>

</html>
